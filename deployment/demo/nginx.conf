pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 64k;
    location = /healthz { proxy_pass http://backend:8000/healthz; proxy_set_header Host localhost; }
    location /api/ {
      # The isolated demo has one private proxy ingress, including Codespaces forwarding.
      # Preserve Origin so the backend validates the configured local/Codespaces URL.
      if ($http_origin = "") { return 403; }
      proxy_pass http://backend:8000;
      proxy_set_header Host localhost;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 2s;
      proxy_read_timeout 20s;
      proxy_next_upstream off;
    }
    location / { try_files $uri /index.html; }
  }
}

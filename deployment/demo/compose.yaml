# Isolated local demo. Never expose these ports publicly or use real provider keys.
x-backend-build: &backend-build
  context: ../..
  dockerfile: deployment/Dockerfile.backend
x-security: &security
  read_only: true
  tmpfs: ["/tmp", "/app/.local:uid=10001,gid=10001,mode=0700"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  mem_limit: 512m
  cpus: 1
services:
  backend:
    <<: *security
    build: *backend-build
    command: ["/app/.venv/bin/uvicorn", "voice_delegate.scaling.scripted_app:create_demo_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--no-proxy-headers"]
    environment:
      VOICE_OFFLINE_DEMO: "1"
      VOICE_ALLOWED_ORIGINS: '${DEMO_ALLOWED_ORIGINS:-["http://localhost:8080"]}'
      VOICE_ALLOWED_HOSTS: '["localhost"]'
      VOICE_WORKER_MODE: offline
      VOICE_WORKER_EXECUTION: remote
      VOICE_WORKER_SERVICE_URL: http://worker:8001
      # Public fixture value, not a credential for any real deployment.
      VOICE_WORKER_SERVICE_TOKEN: offline-demo-only-not-for-public-use
      VOICE_OTEL_ENABLED: "true"
      VOICE_OTEL_ENDPOINT: http://collector:4318/v1/traces
      VOICE_OTEL_METRICS_ENDPOINT: http://collector:4318/v1/metrics
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "voice_delegate.healthcheck"]
      interval: 3s
      timeout: 4s
      start_period: 20s
      retries: 10
    depends_on:
      worker: {condition: service_healthy}
      collector: {condition: service_started}
  worker:
    <<: *security
    build: *backend-build
    command: ["/app/.venv/bin/uvicorn", "voice_delegate.scaling.worker_service:create_worker_app", "--factory", "--host", "0.0.0.0", "--port", "8001", "--no-access-log", "--no-proxy-headers"]
    environment:
      VOICE_WORKER_MODE: offline
      VOICE_WORKER_SERVICE_TOKEN: offline-demo-only-not-for-public-use
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "voice_delegate.healthcheck", "--worker"]
      interval: 3s
      timeout: 4s
      start_period: 20s
      retries: 10
  frontend:
    <<: *security
    build:
      context: ../..
      dockerfile: deployment/Dockerfile.frontend
      args: {VITE_OFFLINE_STACK: "true"}
    tmpfs: ["/tmp", "/var/cache/nginx:uid=101,gid=101,mode=0700"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      backend: {condition: service_healthy}
  collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["../../observability/collector.yaml:/etc/otelcol/config.yaml:ro"]
    mem_limit: 256m
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=24h"]
    volumes: ["../../observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 256m
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 256m

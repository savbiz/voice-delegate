x-build: &build
  context: ../..
  dockerfile: deployment/Dockerfile.backend
x-security: &security
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  cpus: 1.0
  mem_limit: 512m
x-api: &api
  <<: *security
  build: *build
  healthcheck:
    test: ["CMD", "/app/.venv/bin/python", "-m", "voice_delegate.healthcheck"]
    interval: 5s
    timeout: 4s
    start_period: 20s
    retries: 5
  command: ["/app/.venv/bin/uvicorn", "voice_delegate.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--no-access-log", "--no-proxy-headers"]
  volumes: ["quotas:/app/.local"]
  environment: &environment
    VOICE_ENVIRONMENT: production
    # Only the gateway is exposed; it replaces untrusted forwarding headers.
    VOICE_TRUST_PROXY: "true"
    VOICE_PUBLIC_DEMO: "true"
    VOICE_ALLOWED_ORIGIN: ${VOICE_ALLOWED_ORIGIN:-https://demo.example}
    VOICE_ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
    VOICE_INVITE_TOKENS: ${VOICE_INVITE_TOKENS:?Set personal invitations}
    VOICE_MAX_SESSIONS: "8"
    VOICE_DAILY_SESSIONS_PER_USER: ${VOICE_DAILY_SESSIONS_PER_USER:-4}
    VOICE_DAILY_VOICE_SECONDS_PER_USER: ${VOICE_DAILY_VOICE_SECONDS_PER_USER:-1500}
    VOICE_DAILY_VOICE_SECONDS_GLOBAL: ${VOICE_DAILY_VOICE_SECONDS_GLOBAL:-6000}
    VOICE_WORKER_EXECUTION: remote
    VOICE_WORKER_SERVICE_URL: http://worker:8001
    VOICE_WORKER_SERVICE_TOKEN: ${VOICE_WORKER_SERVICE_TOKEN:?Set private worker token}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  depends_on:
    worker:
      condition: service_healthy
services:
  api-a:
    <<: *api
    environment:
      <<: *environment
      VOICE_INSTANCE_ID: a
  api-b:
    <<: *api
    environment:
      <<: *environment
      VOICE_INSTANCE_ID: b
  worker:
    <<: *security
    build: *build
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "voice_delegate.healthcheck", "--worker"]
      interval: 5s
      timeout: 4s
      start_period: 20s
      retries: 5
    command: ["/app/.venv/bin/uvicorn", "voice_delegate.scaling.worker_service:create_worker_app", "--factory", "--host", "0.0.0.0", "--port", "8001", "--workers", "1", "--no-access-log", "--no-proxy-headers"]
    environment:
      VOICE_WORKER_SERVICE_TOKEN: ${VOICE_WORKER_SERVICE_TOKEN:?Set private worker token}
      VOICE_WORKER_MODE: ${VOICE_WORKER_MODE:-offline}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOICE_WORKER_SERVICE_CAPACITY: "4"
    mem_limit: 512m
  gateway:
    <<: *security
    image: nginx:1.27.4-alpine@sha256:4ff102c5d78d254a6f0da062b3cf39eaf07f01eec0927fd21e219d0af8bc0591
    user: "101:101"
    tmpfs: ["/tmp", "/var/cache/nginx:uid=101,gid=101,mode=0700"]
    cpus: 0.5
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["127.0.0.1:18081:8080"]
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy
    mem_limit: 128m
volumes:
  quotas:

events { worker_connections 256; }
http {
  access_log off;
  server_tokens off;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $http_host;
  # Replace incoming forwarding headers with the verified peer address.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Enable only behind a trusted TLS terminator; restrict to its actual subnet.
  # set_real_ip_from 10.0.0.0/24;
  # real_ip_header X-Forwarded-For;
  # real_ip_recursive on;
  client_max_body_size 64k;
  limit_req_zone $binary_remote_addr zone=per_ip:1m rate=20r/s;
  upstream api_pool {
    server api-a:8000 max_fails=1 fail_timeout=5s;
    server api-b:8000 max_fails=1 fail_timeout=5s;
    keepalive 8;
  }
  upstream api_a { server api-a:8000; keepalive 8; }
  upstream api_b { server api-b:8000; keepalive 8; }
  map $uri $api_backend {
    ~^/api/sessions/a- api_a;
    ~^/api/sessions/b- api_b;
    default api_pool;
  }
  server {
    listen 8080;
    location = /healthz {
      proxy_pass http://api_pool;
      add_header Cache-Control no-store always;
    }
    location / {
      limit_req zone=per_ip burst=100 nodelay;
      limit_req_status 429;
      proxy_pass http://$api_backend;
      proxy_connect_timeout 2s;
      proxy_read_timeout 40s;
      proxy_next_upstream off;
      add_header Cache-Control no-store always;
    }
  }
}

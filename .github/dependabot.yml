# Package updates (uv, npm), where most security fixes arrive, are checked weekly; minor and
# patch updates are grouped into one pull request per ecosystem, and each major update is its
# own pull request that can be reviewed, tested and reverted alone. Actions and container images
# change less often and are checked monthly.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/backend
    schedule:
      interval: monthly
    groups:
      workflow-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Container base images are pinned by digest, so nothing updates them unless Dependabot does.
  # A digest-only refresh has no semver update type, so the group takes every update it is offered;
  # moving to a new major image line, or a new Python minor, is a manual upgrade (pyproject, CI
  # matrix and test_python_version change with it), so those are ignored here.
  - package-ecosystem: docker
    directories:
      - /deployment
      - /.devcontainer
    schedule:
      interval: monthly
    groups:
      container-base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directories:
      - /deployment/demo
      - /deployment/scaling
    schedule:
      interval: monthly
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

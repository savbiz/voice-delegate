version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns: ["*"]

  # Container base images are pinned by digest, so nothing updates them unless Dependabot does.
  - package-ecosystem: docker
    directories:
      - /deployment
      - /.devcontainer
    schedule:
      interval: weekly
    groups:
      container-base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories:
      - /deployment/demo
      - /deployment/scaling
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]

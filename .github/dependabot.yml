# Minor and patch updates (where most security fixes arrive) are grouped into one weekly pull
# request per ecosystem. Major updates are left out of the groups, so each one is its own pull
# request that can be reviewed, tested and reverted alone.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Container base images are pinned by digest, so nothing updates them unless Dependabot does.
  - package-ecosystem: docker
    directories:
      - /deployment
      - /.devcontainer
    schedule:
      interval: weekly
    groups:
      container-base-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker-compose
    directories:
      - /deployment/demo
      - /deployment/scaling
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]

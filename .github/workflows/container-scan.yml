name: container-scan

# Vulnerability and misconfiguration scanning of the container images with Trivy. Weekly, on
# demand, and on pull requests that change a container definition or a lock file, not on every
# push. The cheap static audit of the Dockerfiles (scripts/check_containers.py) already runs in
# the main CI; this scans what the images actually contain, including the operating system.
# Findings that have no fix yet are not reported (ignore-unfixed), so a failure is actionable.
on:
  schedule:
    - cron: "53 5 * * 2"
  workflow_dispatch:
  pull_request:
    paths:
      - deployment/**
      - uv.lock
      - frontend/pnpm-lock.yaml
      - .github/workflows/container-scan.yml

permissions:
  contents: read

jobs:
  image:
    name: image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the SARIF results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: deployment/Dockerfile.backend
          - image: frontend
            dockerfile: deployment/Dockerfile.frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -f "${{ matrix.dockerfile }}" -t "voice-delegate-${{ matrix.image }}:scan" .
      - name: List the findings (readable; never fails the run)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: voice-delegate-${{ matrix.image }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"
      - name: Scan for fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: voice-delegate-${{ matrix.image }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          # Without this, SARIF output ignores `severity` and the exit code counts every finding.
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          exit-code: "1"
      - name: Upload the findings to code scanning
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  config:
    name: configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan Dockerfiles and compose files for misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: config
          scan-ref: deployment
          severity: HIGH,CRITICAL
          exit-code: "1"

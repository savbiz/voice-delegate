name: health

# Daily check that the hosted API answers, including a cold start from app sleeping.
# On failure it posts to the ntfy topic in the HEALTH_NTFY_URL repository secret, if set.
# GitHub's own failed-run email depends on the schedule actor's notification settings.
# Checking more often would keep the sleeping service awake and remove its cost saving.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  healthz:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check /healthz
        env:
          URL: https://voice-delegate-api-production.up.railway.app/healthz
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 60 "$URL"; then
              echo
              exit 0
            fi
            sleep 20
          done
          echo "::error::$URL did not answer after three attempts"
          exit 1
      - name: Alert through ntfy
        if: failure()
        env:
          NTFY_URL: ${{ secrets.HEALTH_NTFY_URL }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NTFY_URL" ]; then
            echo "HEALTH_NTFY_URL is not set; relying on GitHub notifications."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 10 \
            -H "Title: voice-delegate API is down" -H "Tags: warning" -H "Click: $RUN" \
            -d "The hosted /healthz did not answer after three attempts." "$NTFY_URL"

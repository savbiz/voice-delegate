name: sbom

# CycloneDX software bills of materials for the Python and frontend runtime dependencies, built
# from the lock files with the tools the project already uses (no extra dependency). They are
# attached to every published release; run it manually to get them as a workflow artifact.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # attach the files to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.15"
          python-version: "3.12"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.19.0"
          package_json_file: frontend/package.json
      - name: Generate the bills of materials
        run: |
          mkdir sbom
          uv export --locked --no-dev --all-packages --format cyclonedx1.5 --preview-features sbom-export --output-file sbom/voice-delegate-python.cdx.json
          (cd frontend && pnpm sbom --sbom-format cyclonedx --prod --lockfile-only > ../sbom/voice-delegate-frontend.cdx.json)
      - name: Check that both are non-empty CycloneDX documents
        run: python3 scripts/check_sbom.py sbom/voice-delegate-python.cdx.json sbom/voice-delegate-frontend.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" sbom/*.cdx.json --clobber --repo "$GITHUB_REPOSITORY"

name: sbom

# CycloneDX software bills of materials for the Python and frontend runtime dependencies, built
# from the lock files with the tools the project already uses (no extra dependency). They are
# attached to every published release with a signed build-provenance attestation (Sigstore, via
# GitHub artifact attestations); run it manually to get them as a workflow artifact.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # attach the files to the release
      id-token: write # sign the attestation with the workflow's OIDC identity
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.19.0"
          package_json_file: frontend/package.json
      - name: Generate the bills of materials
        run: |
          mkdir sbom
          uv export --locked --no-dev --all-packages --format cyclonedx1.5 --preview-features sbom-export --output-file sbom/voice-delegate-python.cdx.json
          (cd frontend && pnpm sbom --sbom-format cyclonedx --prod --lockfile-only > ../sbom/voice-delegate-frontend.cdx.json)
      - name: Check that both are non-empty CycloneDX documents
        run: python3 scripts/check_sbom.py sbom/voice-delegate-python.cdx.json sbom/voice-delegate-frontend.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error
      - name: Attest the build provenance of both documents
        id: attest
        if: github.event_name == 'release'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom/*.cdx.json
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The Sigstore bundle is a signed in-toto statement; the .intoto.jsonl name is the one
          # OpenSSF Scorecard recognises as release provenance.
          cp "$BUNDLE" sbom/voice-delegate.intoto.jsonl
          gh release upload "$TAG" sbom/*.cdx.json sbom/voice-delegate.intoto.jsonl --clobber --repo "$GITHUB_REPOSITORY"

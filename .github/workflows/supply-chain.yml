name: supply-chain

# Known-vulnerability audit of the locked Python and frontend dependencies. It runs weekly, on
# demand and on pull requests that change a lockfile or a dependency declaration, not on every
# push, to save Actions minutes. Dependabot opens the update pull requests; this reports the
# advisories that exist at the time of the run, including for packages nobody has updated yet.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
      - backend/pyproject.toml
      - agent/pyproject.toml
      - frontend/pnpm-lock.yaml
      - frontend/package.json
      - .github/workflows/supply-chain.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.15"
          python-version: "3.12"
      # The lock file pins every package, so resolution is not repeated (--no-deps) and the
      # development and evaluation tools are audited with the runtime packages.
      - name: Export the locked requirements
        run: uv export --locked --all-groups --no-emit-workspace --no-hashes --format requirements-txt --output-file requirements-audit.txt
      - name: Audit against the Python Packaging Advisory Database
        run: uv tool run pip-audit@2.10.1 --requirement requirements-audit.txt --no-deps --disable-pip --progress-spinner off

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.19.0"
          package_json_file: frontend/package.json
      - run: pnpm audit --audit-level moderate

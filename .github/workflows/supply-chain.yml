name: supply-chain

# Known-vulnerability audit of the locked Python and frontend dependencies. It runs weekly, on
# demand and on pull requests that change a lockfile or a dependency declaration, not on every
# push, to save Actions minutes. Dependabot opens the update pull requests; this reports the
# advisories that exist at the time of the run, including for packages nobody has updated yet.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
      - backend/pyproject.toml
      - agent/pyproject.toml
      - frontend/pnpm-lock.yaml
      - frontend/package.json
      - frontend/android/gradle/wrapper/**
      - .github/workflows/supply-chain.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.14"
      # The lock file pins every package, so resolution is not repeated (--no-deps) and the
      # development and evaluation tools are audited with the runtime packages.
      - name: Export the locked requirements
        run: uv export --locked --all-groups --no-emit-workspace --no-hashes --format requirements-txt --output-file requirements-audit.txt
      - name: Audit against the Python Packaging Advisory Database
        run: uv tool run pip-audit@2.10.1 --requirement requirements-audit.txt --no-deps --disable-pip --progress-spinner off

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "11.19.0"
          package_json_file: frontend/package.json
      - run: pnpm audit --audit-level moderate

  # The Android shell commits Gradle's wrapper jar, a binary that runs on every build. This checks
  # it against the checksums Gradle publishes for each release, so a tampered jar fails here.
  gradle-wrapper:
    name: Gradle wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

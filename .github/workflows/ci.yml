name: ci
on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The main ruleset requires the checks "backend (3.12)", "backend (3.13)" and "frontend".
  # Keep these job names exactly. A job skipped by `if` counts as passed for a required check,
  # but a job that never exists (a dropped matrix leg, a workflow-level path filter) blocks merges.
  #
  # A pull request that changes only documentation skips the frontend job, the container build
  # and the smoke tests; backend lint, types, tests and the documentation checks still run. Every
  # condition fails open: if this detection fails, the full pipeline runs.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ]; then
            if files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
                --jq '.[] | .filename, (.previous_filename // empty)'); then
              docs_only=$(printf '%s\n' "$files" | python3 scripts/ci_docs_only.py) || docs_only=false
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"
  backend-312:
    name: backend (3.12)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/backend
        with:
          python: "3.12"
          containers: ${{ needs.changes.outputs.docs_only != 'true' }}
  # Python 3.13 runs on main and tags only; pull requests rely on 3.12.
  backend-313:
    name: backend (3.13)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/backend
        with:
          python: "3.13"
  frontend:
    name: frontend
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.15"
          python-version: "3.12"
      - name: Check project independence
        run: uv run --no-project python ../scripts/check_independence.py
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.19.0"
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Reject unresolved Vercel configuration placeholders
        run: node -e 'if (require("node:fs").readFileSync("vercel.json", "utf8").includes("$" + "{")) { console.error("Unresolved Vercel configuration placeholder"); process.exit(1); }'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build && pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:stack
      - name: Build and sync opt-in native preview without SDK compilation
        env:
          VOICE_NATIVE_BUILD: "true"
          VITE_API_BASE_URL: "https://voice-delegate-api-production.up.railway.app"
        run: pnpm native:sync

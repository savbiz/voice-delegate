name: backend checks
description: Lint, type-check, test and build the Python packages with one Python version.
inputs:
  python:
    description: Python version for uv.
    required: true
  containers:
    description: "'true' also builds the backend container and runs both smoke tests."
    default: "false"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.7"
        python-version: ${{ inputs.python }}
    - name: Check project independence
      shell: bash
      run: uv run --no-project python scripts/check_independence.py
    - shell: bash
      run: uv sync --locked
    - name: Check release tag matches installed version
      if: github.ref_type == 'tag'
      shell: bash
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: uv run python scripts/check_release.py
    - shell: bash
      run: uv run ruff check .
    - shell: bash
      run: uv run ruff format --check .
    - shell: bash
      run: uv run mypy
    - shell: bash
      run: uv run pytest --cov=voice_delegate --cov=voice_delegate_agent --cov-fail-under=85
    - name: Check public API host documentation
      shell: bash
      run: uv run python scripts/check_deployment.py
    - name: Check forbidden files and whitespace rules
      shell: bash
      run: |
        uv run python scripts/check_forbidden_files.py --tracked
        uv run python scripts/check_editorconfig.py --tracked
    - name: Audit container definitions
      shell: bash
      run: uv run python scripts/check_containers.py
    - shell: bash
      run: uv run python scripts/check_links.py
    - shell: bash
      run: uv run python scripts/build_reference.py --check
    - shell: bash
      run: uv build --all-packages
    - name: Set up Docker Buildx
      if: inputs.containers == 'true'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build backend container
      if: inputs.containers == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: deployment/Dockerfile.backend
        tags: voice-delegate:ci
        load: true
        # Reuses unchanged layers between runs. The vulnerability scan (container-scan.yml)
        # deliberately builds without a cache so it always sees current operating-system packages.
        cache-from: type=gha,scope=backend-ci
        cache-to: type=gha,mode=max,scope=backend-ci
    - name: Smoke test offline demo stack
      if: inputs.containers == 'true'
      shell: bash
      run: uv run python scripts/smoke_container.py --demo
    - name: Smoke test backend container
      if: inputs.containers == 'true'
      shell: bash
      run: uv run python scripts/smoke_container.py

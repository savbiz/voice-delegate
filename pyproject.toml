[project]
name = "voice-delegate-workspace"
version = "0.2.0.dev1"
requires-python = ">=3.12"
dependencies = ["voice-delegate"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "agent"]

[tool.uv.sources]
voice-delegate = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.8",
]
eval = [
    "braintrust>=0.3,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src", "backend/tests", "agent/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "evals"]
addopts = "--disable-socket --allow-unix-socket --strict-markers --strict-config -ra"
timeout = 30
filterwarnings = ["error"]

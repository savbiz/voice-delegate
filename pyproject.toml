[project]
name = "voice-delegate-workspace"
version = "0.5.0"
requires-python = ">=3.14,<3.15"
dependencies = ["voice-delegate"]

[tool.uv]
package = false
constraint-dependencies = ["langgraph-sdk>=0.4.4", "certifi>=2026.10.19"]

[tool.uv.workspace]
members = ["backend", "agent"]

[tool.uv.sources]
voice-delegate = { workspace = true }

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.8",
    "schemathesis>=4,<5",
]
eval = [
    "braintrust>=0.3,<1",
]
loadtest = [
    "locust>=2.43,<3",
]
mutation = [
    "mutmut>=3,<4",
]

[tool.ruff]
extend-exclude = ["mutants"]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "PT", "ARG", "RUF", "SIM", "C4", "DTZ", "TRY", "PERF"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["ARG", "PT011", "PT018", "TRY003", "TRY301"]
"evals/test_*.py" = ["ARG", "PT011", "PT018", "TRY003", "TRY301"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
files = ["backend/src", "backend/tests", "agent/src", "evals", "scripts", "test_support", "loadtest"]

[[tool.mypy.overrides]]
module = ["locust", "locust.*"]
ignore_missing_imports = true

# CI installs only the default groups, so locust is absent there and its classes are Any.
# The scenario file is checked with the same settings whether or not locust is installed.
[[tool.mypy.overrides]]
module = ["locustfile"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests", "evals"]
pythonpath = ["."]
addopts = "--disable-socket --allow-unix-socket --strict-markers --strict-config -ra"
timeout = 30
filterwarnings = [
  "error",
  # langsmith 0.14 still calls asyncio.iscoroutinefunction, deprecated in Python 3.14.
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]

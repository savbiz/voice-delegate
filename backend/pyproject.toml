[project]
name = "voice-delegate"
version = "0.2.0.dev1"
description = "Reference architecture for voice conversations with delegated workers"
readme = "README.md"
authors = [
    { name = "Savino Bizzoca" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "voice-delegate-agent",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.1",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"


[tool.uv.sources]
voice-delegate-agent = { workspace = true }

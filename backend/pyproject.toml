[project]
name = "voice-delegate"
version = "0.4.0"
description = "Reference architecture for voice conversations with delegated workers"
readme = "README.md"
authors = [
    { name = "Savino Bizzoca" }
]
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "voice-delegate-agent",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.4,<18",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"


[tool.uv.sources]
voice-delegate-agent = { workspace = true }

# Mutation testing of the limits and admission code: `make mutation` from the repository root
# (scripts/mutation.py). Run from this directory so mutmut sees the standard src/ layout.
[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/voice_delegate/limits/*.py", "src/voice_delegate/admission/*.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_admission.py",
    "tests/test_admission_properties.py",
    "tests/test_admission_rules.py",
    "tests/test_limits_boundaries.py",
    "tests/test_ratelimit.py",
    "tests/test_ratelimit_properties.py",
    "tests/test_body_limit.py",
    "tests/test_session.py",
    "tests/test_session_edges.py",
    "tests/test_personal_sessions.py",
    "tests/test_result_citations.py",
    "tests/test_runner_edges.py",
]
also_copy = ["tests/"]
# The repository's pytest settings live in the root pyproject.toml, which mutmut does not see.
pytest_add_cli_args = [
    "-p", "no:cacheprovider",
    "-o", "asyncio_mode=auto",
    "--disable-socket", "--allow-unix-socket",
    "--timeout=30",
]
